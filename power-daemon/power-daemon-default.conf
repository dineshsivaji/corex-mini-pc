# Mini PC power-daemon configuration.
# Copy to /etc/default/power-daemon (root:root, mode 0600) and fill in real values.
# All keys are optional — defaults in power_daemon.py apply if unset.

# Network targets
# BEACON_IP: device on the utility line the daemon pings to infer grid state.
# Currently the ESP32 at 192.168.1.32 (replaced the old Zeb SP110 smart plug).
POWER_DAEMON_BEACON_IP=192.168.1.32
POWER_DAEMON_GATEWAY_IP=192.168.1.1
POWER_DAEMON_TAPO_IP=192.168.1.110

# Tapo P110 credentials (TP-Link cloud account)
POWER_DAEMON_TAPO_EMAIL=***
POWER_DAEMON_TAPO_PASSWORD=****

# NATS JetStream — daemon publishes notifications here (host-published port).
# Defaults shown; uncomment to override.
# POWER_DAEMON_NATS_URL=nats://127.0.0.1:4222
# POWER_DAEMON_NATS_SUBJECT=notify.whatsapp

# Storage
POWER_DAEMON_HDD_DEVICE=/dev/sda
POWER_DAEMON_STORAGE_MOUNT=/mnt/storage

# Tunables (uncomment to override defaults)
POWER_DAEMON_PING_INTERVAL_SEC=30
POWER_DAEMON_FAILURE_THRESHOLD_SEC=120
POWER_DAEMON_TAPO_COUNTDOWN_SEC=60
POWER_DAEMON_PING_TIMEOUT_SEC=5
POWER_DAEMON_PING_PACKET_COUNT=5    # bump to 10 if the beacon (ESP32) WiFi is flaky

# WhatsApp recipient (jid, group id, or +country number). Empty → gateway GROUP_ID.
POWER_DAEMON_WHATSAPP_TO=+919791427665
