alias: Play Voice Message
mode: single
fields:
  url:
    description: MP3 URL
sequence:
  - action: media_player.turn_on
    target:
      entity_id: media_player.master_bedroom_speaker
  - delay: "00:00:02"
  - action: media_player.volume_set
    target:
      entity_id: media_player.master_bedroom_speaker
    data:
      volume_level: 0.8
  - delay: "00:00:02"
  - action: media_player.play_media
    target:
      entity_id: media_player.master_bedroom_speaker
    data:
      media:
        media_content_id: "{{ url }}"
        media_content_type: music
        metadata: {}
  - delay: "00:00:30"
  - action: media_player.volume_set
    target:
      entity_id: media_player.master_bedroom_speaker
    data:
      volume_level: 0.4
description: ""

