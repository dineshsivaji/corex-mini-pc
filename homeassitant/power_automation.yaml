# Power-automation HA automations.
# Append the contents below to your automations.yaml (or use !include_dir_merge_list).
# WhatsApp phone number is read from secrets.yaml as `whatsapp_phone`.
#
# Three former entries (Power Cut Imminent, Tapo Command Failed, Mini PC
# Recovered) were removed when the power-daemon was migrated to publish
# those notifications directly to NATS JetStream. The daemon now formats
# the messages itself (including the "Mini PC is X" rotating status line)
# and ships them via the WhatsApp server's in-process NATS consumer.
# `counter.recovery_index` in configuration.yaml is now unused.

# 1. ESP32 sends a heartbeat hourly. Update last-seen timestamp.
- alias: ESP32 Heartbeat Receiver
  description: Update last-seen timestamp on each ESP32 heartbeat.
  triggers:
    - trigger: webhook
      webhook_id: esp32_heartbeat
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.esp32_last_seen
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  mode: single

# 2. Alert if ESP32 hasn't been heard from in 3 hours.
- alias: Dead ESP32 Alert
  description: WhatsApp alert when ESP32 watchdog goes silent.
  triggers:
    - trigger: time_pattern
      minutes: "/30"
  conditions:
    - condition: template
      value_template: >-
        {{ (now().timestamp() -
            states('input_datetime.esp32_last_seen') | as_timestamp(0)) > 10800 }}
  actions:
    - action: shell_command.whatsapp_alert
      data:
        to: !secret whatsapp_phone
        message: >-
          ⚠️ ESP32 watchdog dead. Last seen
          {{ as_timestamp(states('input_datetime.esp32_last_seen'))
             | timestamp_custom('%Y-%m-%d %H:%M', false) }}
          ({{ ((now().timestamp() -
                as_timestamp(states('input_datetime.esp32_last_seen'))) / 3600)
              | round(1) }}h ago).
  mode: single

# 3. Mini PC stays unreachable while Tapo is ON (boot failure / hung).
- alias: Mini PC Stuck Alert
  description: Alert when Tapo is on but Mini PC won't come up.
  triggers:
    - trigger: webhook
      webhook_id: esp32_mini_pc_stuck
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: shell_command.whatsapp_alert
      data:
        to: !secret whatsapp_phone
        message: >-
          ⚠️ Mini PC unreachable but Tapo is ON. Possible boot failure —
          investigate.
  mode: single
