
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
media_dirs:
  media: /config/media

input_number:
  water_voice_index:
    name: Water Voice Index
    min: 0
    max: 3
    step: 1
  bathroom_voice_index:
    name: Bathroom Voice Index
    min: 0
    max: 1
    step: 1

# Power-automation: track last ESP32 heartbeat for dead-watchdog detection.
input_datetime:
  esp32_last_seen:
    name: ESP32 Last Heartbeat
    has_date: true
    has_time: true

# Generic WhatsApp sender. Pass `to` and `message` from automations.
# Phone number lives in secrets.yaml as `whatsapp_phone` (not committed).
shell_command:
  whatsapp_alert: >-
    curl -s -X POST http://localhost:3001/send
    -H "Content-Type: application/json"
    -d '{"to": "{{ to }}", "message": "{{ message }}"}'

# Sequential cursor for the 100 status lines used by Mini PC Recovered alert.
# Persists across HA restarts so the line rotation continues normally.
counter:
  recovery_index:
    name: Recovery Message Cursor
    initial: 0
    step: 1
    restore: true

# --- Voice assistant: ask ChatGPT via chatgpt_api.py (added 2026-11-27) ---
rest_command:
  ask_chatgpt:
    url: "http://127.0.0.1:8090/ask"
    method: POST
    content_type: "application/json"
    payload: '{{ {"question": question} | to_json }}'
    timeout: 120

# --- Allow Caddy (LAN-only HTTPS at https://ha.home.dineshsivaji.dev) to proxy HA ---
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
