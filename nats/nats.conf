# NATS server configuration for the mini PC.
#
# NOTE: max_payload is NOT a command-line flag — it only exists as a config
# setting. Passing `--max_payload=...` on the command line fails with
# "flag provided but not defined: -max_payload". Hence this config file.

port: 4222
http_port: 8222          # monitoring endpoint (used by the compose healthcheck)

max_payload: 8MB         # headroom for media on notify.whatsapp.media (default is 1MB)

jetstream {
  store_dir: "/data"     # replaces the -sd flag; enabling this block turns JetStream on
}
